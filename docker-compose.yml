services:
  postgres:
    image: postgres:16-alpine
    container_name: sems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sems_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sems_password}
      POSTGRES_DB: ${DB_NAME:-sems_db}
      TZ: Asia/Bangkok
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sems_user} -d ${DB_NAME:-sems_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: sems-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: sems_postgres_data
