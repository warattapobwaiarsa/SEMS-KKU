services:
  db:
    image: postgres:16-alpine
    container_name: sems-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sems_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sems-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sems-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sems_db}?schema=public
      AES_CITIZEN_ID_KEY: ${AES_CITIZEN_ID_KEY}
      ALLOW_MOCK_AUTH: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    networks:
      - sems-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sems-frontend-prod
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    networks:
      - sems-network

volumes:
  postgres_data_prod:

networks:
  sems-network:
    driver: bridge
