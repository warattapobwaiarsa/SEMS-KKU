  /applicants/{applicantId}/my-evaluation:
    get:
      tags:
        - Evaluations
      summary: Get My Evaluation for Applicant (Evaluator)
      description: |-
        Returns evaluator's draft or submitted score for applicant.
        Embeds subCriteria detail { id, title, type, maxScore, allowComment } in each item so evaluator can view evaluation details in CLOSED rounds without calling criteria endpoint.
        If evaluator has an existing evaluation: accessible in both OPEN and CLOSED rounds (read-only).
        If evaluator has no draft and round is CLOSED: returns 404 Not Found (IDOR protection).
      operationId: getMyEvaluation
      security:
        - cookieAuth: []
      parameters:
        - name: applicantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evaluation score details with embedded subCriteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/MyEvaluationResponseDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
    put:
      tags:
        - Evaluations
      summary: Auto-save / Upsert Evaluation Draft (Evaluator)
      description: |-
        Upserts draft evaluation scores.
        Rules:
        - If existing evaluation and round is CLOSED: returns 409 ROUND_CLOSED (MSG-19).
        - If no existing evaluation and round is not OPEN: returns 404 Not Found.
        - If evaluation already SUBMITTED: returns 409 ALREADY_EVALUATED (MSG-17).
        - If evaluator expired and starting a new applicant: returns 422 EVALUATOR_EXPIRED_NEW_APPLICANT (MSG-18).
        - Concurrency & No-op: If payload equals DB exactly, returns 200 without updating DB or updatedAt. If clientUpdatedAt is older than DB updatedAt, returns 409 STALE_VERSION.
      operationId: upsertDraftEvaluation
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: applicantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDraftEvaluationDto"
      responses:
        "200":
          description: Draft saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/MyEvaluationResponseDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: "Conflict: Round closed, already submitted, or stale draft version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              examples:
                staleVersion:
                  summary: Concurrency conflict (clientUpdatedAt older than DB updatedAt)
                  value:
                    success: false
                    statusCode: 409
                    errorCode: STALE_VERSION
                    error: CONFLICT
                    params:
                      serverUpdatedAt: "2026-10-06T14:00:00.000+07:00"
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                roundClosed:
                  summary: Round closed while modifying draft (BR-EVL-12, MSG-19)
                  value:
                    success: false
                    statusCode: 409
                    errorCode: ROUND_CLOSED
                    error: CONFLICT
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                alreadyEvaluated:
                  summary: Evaluation already submitted (BR-EVL-02, MSG-17)
                  value:
                    success: false
                    statusCode: 409
                    errorCode: ALREADY_EVALUATED
                    error: CONFLICT
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
        "422":
          description: Score out of range or expired evaluator starting new evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              examples:
                scoreOutOfRange:
                  summary: Score exceeds max score (BR-EVL-03, MSG-15)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: SCORE_OUT_OF_RANGE
                    error: UNPROCESSABLE_ENTITY
                    params:
                      max: 40
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                evaluatorExpired:
                  summary: Expired evaluator cannot start evaluating new applicant (BR-USR-11, MSG-18)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: EVALUATOR_EXPIRED_NEW_APPLICANT
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
        "429":
          $ref: "#/components/responses/RateLimitedError"
