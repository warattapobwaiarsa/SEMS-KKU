openapi: 3.0.3
info:
  title: Scholarship Evaluation Management System (SEMS-KKU) REST API
  version: 2.8.0
  description: |-
    ระบบบริหารจัดการการประเมินทุนการศึกษา มหาวิทยาลัยขอนแก่น (SEMS-KKU)
    REST API Specification & Architecture Blueprint v2.8 (Final Sealed Benchmark)
    สอดคล้องตาม Business Rules (BR v1.2), FRS v0.1, NFR v0.1, และ Prisma Schema (PostgreSQL)
  contact:
    name: SEMS-KKU Development Team
    email: sems-kku@kku.ac.th
  license:
    name: Proprietary / Educational - Khon Kaen University
    url: https://www.kku.ac.th
servers:
  - url: /api/v1
    description: API v1 Base URL prefix
tags:
  - name: Auth
    description: Authentication & Session Management
  - name: Users
    description: User & Evaluator Management (Admin Only)
  - name: ScholarshipRounds
    description: Scholarship Round Lifecycle (Draft -> Open -> Closed)
  - name: Criteria
    description: Independent Evaluation Criteria & Sub-criteria Configuration
  - name: Applicants
    description: Applicant Data & Excel Import Pipeline
  - name: Evaluations
    description: Evaluation Scoring, Auto-save & Real-time Rankings
  - name: Allocations
    description: Budgeting & Scholarship Allocation Management
  - name: Reports
    description: Password-protected Report Generation & Secure Binary Export
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sems_session
      description: HttpOnly SameSite Session Cookie
    csrfProtection:
      type: apiKey
      in: header
      name: X-Requested-With
      description: Custom CSRF protection header (e.g. XMLHttpRequest)
  responses:
    UnauthorizedError:
      description: Unauthorized - Missing, expired, replaced session, or account deactivated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardErrorResponse"
          examples:
            missingSession:
              summary: No session provided
              value:
                success: false
                statusCode: 401
                errorCode: UNAUTHORIZED
                error: UNAUTHORIZED
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
            sessionReplaced:
              summary: Logged in from another device (BR-EVL-08)
              value:
                success: false
                statusCode: 401
                errorCode: SESSION_REPLACED
                error: UNAUTHORIZED
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
            sessionIdleTimeout:
              summary: Session expired from inactivity (BR-SYS-02)
              value:
                success: false
                statusCode: 401
                errorCode: SESSION_IDLE_TIMEOUT
                error: UNAUTHORIZED
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
            accountDeactivated:
              summary: Account has been deactivated (BR-USR-01)
              value:
                success: false
                statusCode: 401
                errorCode: ACCOUNT_DEACTIVATED
                error: UNAUTHORIZED
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
    ForbiddenError:
      description: Forbidden - Insufficient role permissions or missing CSRF header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardErrorResponse"
          examples:
            roleForbidden:
              summary: Role not permitted (Cross-role access)
              value:
                success: false
                statusCode: 403
                errorCode: FORBIDDEN
                error: FORBIDDEN
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
            csrfRejected:
              summary: Missing X-Requested-With header on mutation (NFR-SEC-10)
              value:
                success: false
                statusCode: 403
                errorCode: CSRF_REJECTED
                error: FORBIDDEN
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
    NotFoundError:
      description: Not Found - Resource not found or hidden by policy (IDOR protection)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardErrorResponse"
          example:
            success: false
            statusCode: 404
            errorCode: NOT_FOUND
            error: NOT_FOUND
            params: null
            timestamp: "2026-10-06T14:00:00.000+07:00"
    RateLimitedError:
      description: Too Many Requests - Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Number of seconds to wait before retrying request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardErrorResponse"
          example:
            success: false
            statusCode: 429
            errorCode: RATE_LIMITED
            error: TOO_MANY_REQUESTS
            params:
              retryAfterSeconds: 60
            timestamp: "2026-10-06T14:00:00.000+07:00"
    PayloadTooLargeError:
      description: Payload Too Large - Request body exceeds limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardErrorResponse"
          example:
            success: false
            statusCode: 413
            errorCode: FILE_TOO_LARGE
            error: PAYLOAD_TOO_LARGE
            params:
              maxSize: 50MB
            timestamp: "2026-10-06T14:00:00.000+07:00"
  schemas:
    ErrorCode:
      type: string
      enum:
        - FILE_TOO_LARGE
        - RATE_LIMITED
        - CSRF_REJECTED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - ACCOUNT_DEACTIVATED
        - SESSION_REPLACED
        - SESSION_IDLE_TIMEOUT
        - CANNOT_DEACTIVATE_EVALUATOR_WITH_DRAFT
        - CANNOT_DEACTIVATE_SELF_OR_LAST_ADMIN
        - EXPIRY_DAYS_REQUIRED
        - VALIDITY_DAYS_INVALID
        - CRITERIA_SUM_NOT_100
        - MAX_SCORE_OUT_OF_RANGE
        - SCORED_CRITERIA_REQUIRED
        - CRITERIA_LOCKED
        - CRITERIA_NAME_DUPLICATE
        - ROUND_OPEN_PRECHECK_FAILED
        - INVALID_EXCEL_FILE
        - INVALID_EXCEL_ROW
        - EXCEL_NO_VALID_ROWS
        - EXCEL_INVALID_ROWS_ACK_REQUIRED
        - EXCEL_MISSING_SHEET_OR_COLUMNS
        - PREVIEW_TOKEN_INVALID
        - PREVIEW_TOKEN_EXPIRED
        - PREVIEW_TOKEN_ALREADY_USED
        - SCORE_OUT_OF_RANGE
        - SCORES_INCOMPLETE
        - ALREADY_EVALUATED
        - EVALUATOR_EXPIRED_NEW_APPLICANT
        - ROUND_CLOSED
        - ROUND_CLOSE_STATE_CHANGED
        - ROUND_CLOSE_ACK_REQUIRED
        - STALE_VERSION
        - BUDGET_MUST_BE_POSITIVE
        - CANNOT_EDIT_BUDGET_ALLOCATED
        - ALLOCATION_EXCEEDS_BUDGET
        - ALLOCATION_AMOUNT_MISMATCH
        - ZERO_SCORE_CANNOT_AWARD
        - ALLOCATION_LOCKED_FINALIZED
        - INVALID_ROUND_STATUS
        - INVALID_ALLOCATION_STATUS
        - EMAIL_ALREADY_EXISTS_OR_INVALID
        - ACADEMIC_YEAR_OUT_OF_RANGE
        - SEMESTER_OUT_OF_RANGE
      description: Semantic error code for client-side localization (BR-SYS-01)
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
    StandardErrorResponse:
      type: object
      required:
        - success
        - statusCode
        - errorCode
        - error
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 422
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        error:
          type: string
          example: UNPROCESSABLE_ENTITY
        params:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time
          example: "2026-10-06T14:00:00.000+07:00"
    UnsubmittedApplicantItem:
      type: object
      required:
        - applicantId
        - studentCode
        - titlePrefix
        - firstName
        - lastName
      properties:
        applicantId:
          type: integer
          example: 101
        studentCode:
          type: string
          example: 643020000-1
        titlePrefix:
          type: string
          example: นาย
        firstName:
          type: string
          example: สมชาย
        lastName:
          type: string
          example: ใจดี
    UserRole:
      type: string
      enum:
        - ADMIN
        - EVALUATOR
      example: ADMIN
    SessionUserDto:
      type: object
      required:
        - id
        - email
        - name
        - role
        - isActive
        - serverTime
        - idleTimeoutSeconds
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: admin@kku.ac.th
        name:
          type: string
          example: ผศ.ดร. สมชาย ใจดี
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
          example: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: null
        isExpired:
          type: boolean
          example: false
        serverTime:
          type: string
          format: date-time
          example: "2026-10-06T14:00:00.000+07:00"
        idleTimeoutSeconds:
          type: integer
          example: 3600
      description: Authenticated user profile returned by /auth/me and SSO callback
    UserDto:
      type: object
      required:
        - id
        - email
        - name
        - role
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: evaluator@kku.ac.th
        name:
          type: string
          example: อ.ดร. นันทวัน รักเรียน
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
          example: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59.000+07:00"
        isExpired:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-10-01T08:30:00.000+07:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-06T14:00:00.000+07:00"
      description: User record for Admin user management operations
    CreateUserDto:
      type: object
      required:
        - email
        - name
        - role
      properties:
        email:
          type: string
          format: email
          example: evaluator@kku.ac.th
        name:
          type: string
          example: อ.ดร. นันทวัน รักเรียน
        role:
          $ref: "#/components/schemas/UserRole"
        days:
          type: integer
          minimum: 1
          example: 90
          description: Required for Evaluator (validity period in days per BR-USR-04, no ceiling); forbidden/ignored for Admin
    UpdateUserDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: อ.ดร. นันทวัน รักเรียน (แก้ไข)
    UpdateUserStatusDto:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          example: true
        days:
          type: integer
          minimum: 1
          example: 60
          description: Required when reactivating an Evaluator (BR-USR-08, positive integer without ceiling)
    ExtendUserExpiryDto:
      type: object
      required:
        - days
      properties:
        days:
          type: integer
          minimum: 1
          example: 30
          description: Number of days to extend Evaluator validity (BR-USR-07, FR-USR-11, positive integer without ceiling)
    RoundStatus:
      type: string
      enum:
        - DRAFT
        - OPEN
        - CLOSED
      example: DRAFT
    ScholarshipRoundDto:
      type: object
      required:
        - id
        - name
        - academicYear
        - semester
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: ทุนการศึกษาเพื่อการศึกษาต่อ ระดับปริญญาตรี ประจำปี 2569
        academicYear:
          type: integer
          minimum: 2550
          maximum: 2700
          example: 2569
        semester:
          type: integer
          minimum: 1
          maximum: 2
          example: 1
        criteriaId:
          type: integer
          nullable: true
          example: 1
        status:
          $ref: "#/components/schemas/RoundStatus"
        openedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateScholarshipRoundDto:
      type: object
      required:
        - name
        - academicYear
        - semester
      properties:
        name:
          type: string
          example: ทุนการศึกษาคณะวิทยาการสารสนเทศ ประจำปี 2569
        academicYear:
          type: integer
          minimum: 2550
          maximum: 2700
          example: 2569
        semester:
          type: integer
          minimum: 1
          maximum: 2
          example: 1
    UpdateScholarshipRoundDto:
      type: object
      properties:
        name:
          type: string
          example: ทุนการศึกษาคณะวิทยาการสารสนเทศ ประจำปี 2569 (แก้ไข)
        academicYear:
          type: integer
          minimum: 2550
          maximum: 2700
          example: 2569
        semester:
          type: integer
          minimum: 1
          maximum: 2
          example: 1
    LinkRoundCriteriaDto:
      type: object
      required:
        - criteriaId
      properties:
        criteriaId:
          type: integer
          nullable: true
          example: 1
          description: Criteria ID to link, or null to unlink
    RoundOpenPrecheckResponseDto:
      type: object
      required:
        - canOpen
        - checks
        - lastInvalidRowsCount
      properties:
        canOpen:
          type: boolean
          example: true
        lastInvalidRowsCount:
          type: integer
          example: 0
          description: Number of invalid rows in last import batch (BR-RND-09)
        checks:
          type: object
          required:
            - hasCriteria
            - criteriaSumValid
            - hasApplicants
          properties:
            hasCriteria:
              type: boolean
              example: true
            criteriaSumValid:
              type: boolean
              example: true
            hasApplicants:
              type: boolean
              example: true
            applicantCount:
              type: integer
              example: 45
            criteriaSum:
              type: integer
              example: 100
        reasons:
          type: array
          items:
            type: string
    RoundCloseCheckResponseDto:
      type: object
      required:
        - unsubmittedCount
        - applicants
      properties:
        unsubmittedCount:
          type: integer
          example: 2
        applicants:
          type: array
          items:
            $ref: "#/components/schemas/UnsubmittedApplicantItem"
    CloseScholarshipRoundDto:
      type: object
      properties:
        acknowledged:
          type: boolean
          example: true
          description: Required when unsubmittedCount > 0
        acknowledgedCount:
          type: integer
          example: 2
          description: Required when unsubmittedCount > 0
    SubCriteriaType:
      type: string
      enum:
        - SCORED
        - TEXT
      example: SCORED
    SubCriteriaDto:
      type: object
      required:
        - id
        - criteriaId
        - sortOrder
        - title
        - type
        - allowComment
      properties:
        id:
          type: integer
          example: 1
        criteriaId:
          type: integer
          example: 1
        sortOrder:
          type: integer
          example: 1
        title:
          type: string
          example: ผลการเรียนเฉลี่ยสะสม (GPAX)
        type:
          $ref: "#/components/schemas/SubCriteriaType"
        maxScore:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          example: 40
        allowComment:
          type: boolean
          example: true
    RoundUsageItemDto:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: ทุนการศึกษาประจำปี 2569
        status:
          $ref: "#/components/schemas/RoundStatus"
    CriteriaDetailDto:
      type: object
      required:
        - id
        - name
        - isLocked
        - usedByRounds
        - subCriteria
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: เกณฑ์การประเมินประจำปี 2569
        isLocked:
          type: boolean
          example: false
          description: True if used by any OPEN or CLOSED round
        totalScore:
          type: integer
          example: 100
        usedByRounds:
          type: array
          items:
            $ref: "#/components/schemas/RoundUsageItemDto"
        subCriteria:
          type: array
          items:
            $ref: "#/components/schemas/SubCriteriaDto"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCriteriaDto:
      type: object
      required:
        - name
        - subCriteria
      properties:
        name:
          type: string
          example: เกณฑ์การประเมินประจำปี 2569
        subCriteria:
          type: array
          items:
            type: object
            required:
              - sortOrder
              - title
              - type
            properties:
              sortOrder:
                type: integer
                minimum: 1
                example: 1
              title:
                type: string
                example: ความประพฤติและกิจกรรม
              type:
                $ref: "#/components/schemas/SubCriteriaType"
              maxScore:
                type: integer
                minimum: 1
                maximum: 100
                example: 40
              allowComment:
                type: boolean
                default: false
    UpdateCriteriaDto:
      type: object
      required:
        - name
        - subCriteria
      properties:
        name:
          type: string
          example: เกณฑ์การประเมินประจำปี 2569 (ปรับปรุง)
        subCriteria:
          type: array
          items:
            type: object
            required:
              - sortOrder
              - title
              - type
            properties:
              id:
                type: integer
                nullable: true
                description: Existing subCriteria ID for in-place update; omit for new row
              sortOrder:
                type: integer
                minimum: 1
                example: 1
              title:
                type: string
                example: ความประพฤติและกิจกรรม
              type:
                $ref: "#/components/schemas/SubCriteriaType"
              maxScore:
                type: integer
                minimum: 1
                maximum: 100
                example: 40
              allowComment:
                type: boolean
                default: false
    ExcelPreviewRowDto:
      type: object
      required:
        - rowNumber
        - studentCode
        - titlePrefix
        - firstName
        - lastName
        - faculty
        - major
        - studyYear
        - gpa
        - maskedCitizenId
        - isValid
        - errors
      properties:
        rowNumber:
          type: integer
          example: 2
        studentCode:
          type: string
          example: 643020000-1
        titlePrefix:
          type: string
          example: นาย
        firstName:
          type: string
          example: สมชาย
        lastName:
          type: string
          example: ใจดี
        faculty:
          type: string
          example: คณะวิทยาการสารสนเทศ
        major:
          type: string
          example: วิทยาการคอมพิวเตอร์
        studyYear:
          type: integer
          example: 3
        gpa:
          type: number
          format: float
          example: 3.75
        maskedCitizenId:
          type: string
          example: 1-2345-XXXXX-XX-3
        isValid:
          type: boolean
          example: true
        errors:
          type: array
          items:
            type: string
    ExcelPreviewSummaryDto:
      type: object
      required:
        - previewToken
        - totalRows
        - validRows
        - invalidRows
        - expiresAt
        - rows
      properties:
        previewToken:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        totalRows:
          type: integer
          example: 50
        validRows:
          type: integer
          example: 48
        invalidRows:
          type: integer
          example: 2
        expiresAt:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ExcelPreviewRowDto"
    ConfirmImportDto:
      type: object
      required:
        - previewToken
      properties:
        previewToken:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        acknowledgedInvalidRows:
          type: boolean
          default: false
    ImportBatchDto:
      type: object
      required:
        - id
        - roundId
        - fileName
        - totalRows
        - validRows
        - invalidRows
        - importedById
        - importedByName
        - importedAt
      properties:
        id:
          type: integer
          example: 1
        roundId:
          type: integer
          example: 1
        fileName:
          type: string
          example: applicants_2569_batch1.xlsx
        totalRows:
          type: integer
          example: 50
        validRows:
          type: integer
          example: 48
        invalidRows:
          type: integer
          example: 2
        importedById:
          type: integer
          example: 1
        importedByName:
          type: string
          example: Admin User
        importedAt:
          type: string
          format: date-time
    ApplicantListItemDto:
      type: object
      required:
        - id
        - roundId
        - studentCode
        - titlePrefix
        - firstName
        - lastName
        - faculty
        - major
        - studyYear
        - gpa
      properties:
        id:
          type: integer
          example: 101
        roundId:
          type: integer
          example: 1
        studentCode:
          type: string
          example: 643020000-1
        titlePrefix:
          type: string
          example: นาย
        firstName:
          type: string
          example: สมชาย
        lastName:
          type: string
          example: ใจดี
        faculty:
          type: string
          example: คณะวิทยาการสารสนเทศ
        major:
          type: string
          example: วิทยาการคอมพิวเตอร์
        studyYear:
          type: integer
          minimum: 1
          maximum: 4
          example: 3
        gpa:
          type: number
          format: float
          example: 3.75
        legacySeq:
          type: integer
          nullable: true
          example: 1
          description: Sequential number from original imported Excel (FR-APP-03 E3)
        submittedCount:
          type: integer
          example: 2
          description: Number of submitted evaluations
        myStatus:
          type: string
          enum:
            - NOT_STARTED
            - DRAFT
            - SUBMITTED
          example: DRAFT
          description: Evaluator view only
        canStart:
          type: boolean
          example: true
          description: "Evaluator view: false if expired and no draft exists (BR-USR-11)"
    ApplicantSupportingInfoDto:
      type: object
      properties:
        applicationDate:
          type: string
          nullable: true
        accommodation:
          type: string
          nullable: true
        rent:
          type: string
          nullable: true
        personalExpense:
          type: string
          nullable: true
        studyEquipmentCost:
          type: string
          nullable: true
        electronicDevices:
