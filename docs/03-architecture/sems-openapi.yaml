  /reports/evaluation-ranking/export:
    post:
      tags:
        - Reports
      summary: Export Evaluation Ranking Report (Admin)
      description: Generates password-protected .xlsx file of evaluation rankings without citizen IDs (BR-EXP-06). Rate limit 5/min/User. Returns binary stream with Content-Disposition header.
      operationId: exportEvaluationRankingReport
      security:
        - cookieAuth: []
        - csrfProtection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportReportDto"
      responses:
        "200":
          description: Excel file stream (.xlsx)
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="evaluation_ranking_2569.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
