    post:
      tags:
        - ScholarshipRounds
      summary: Close Scholarship Round (Admin)
      description: |-
        Closes round (OPEN -> CLOSED).
        Acknowledgment Pipeline:
        1. If unsubmittedCount == 0: can close immediately without acknowledge flag.
        2. If unsubmittedCount > 0 and client did not provide acknowledged: true or acknowledgedCount is undefined: returns 422 ROUND_CLOSE_ACK_REQUIRED.
        3. If unsubmittedCount > 0 and acknowledgedCount does not match fresh server count: returns 409 ROUND_CLOSE_STATE_CHANGED.
      operationId: closeScholarshipRound
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseScholarshipRoundDto"
      responses:
        "200":
          description: Round closed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/ScholarshipRoundDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: "Conflict: Round already closed, not OPEN, or unsubmitted state changed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              examples:
                stateChanged:
                  summary: Unsubmitted count changed between close-check and confirmation
                  value:
                    success: false
                    statusCode: 409
                    errorCode: ROUND_CLOSE_STATE_CHANGED
                    error: CONFLICT
                    params:
                      count: 3
                      applicants:
                        - applicantId: 101
                          studentCode: 643020000-1
                          titlePrefix: นาย
                          firstName: สมชาย
                          lastName: ใจดี
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                notOpen:
                  summary: Round is not in OPEN status
                  value:
                    success: false
                    statusCode: 409
                    errorCode: INVALID_ROUND_STATUS
                    error: CONFLICT
                    params:
                      status: DRAFT
                      action: close_round
                    timestamp: "2026-10-06T14:00:00.000+07:00"
        "422":
          description: Acknowledgment required for unsubmitted applicants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              example:
                success: false
                statusCode: 422
                errorCode: ROUND_CLOSE_ACK_REQUIRED
                error: UNPROCESSABLE_ENTITY
                params:
                  count: 2
                  applicants:
                    - applicantId: 101
                      studentCode: 643020000-1
                      titlePrefix: นาย
