              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              example:
                success: false
                statusCode: 409
                errorCode: INVALID_ROUND_STATUS
                error: CONFLICT
                params:
                  status: OPEN
                  action: export_ranking_report
                timestamp: "2026-10-06T14:00:00.000+07:00"
        "429":
          $ref: "#/components/responses/RateLimitedError"
