paths:
  /auth/sso/callback:
    post:
      tags:
        - Auth
      summary: KKU SSO Callback & Session Establishment [TBD Protocol]
      description: Verifies SSO credential token, validates account status (BR-USR-01), enforces single-device session (BR-EVL-08), and sets HttpOnly SameSite session cookie.
      operationId: ssoCallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: sso_auth_code_12345
                state:
                  type: string
                  example: random_state_string
      responses:
        "200":
          description: Login successful. Sets sems_session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: sems_session=jwt_session_token; Path=/; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/SessionUserDto"
        "401":
          description: Account deactivated or not authorized (BR-USR-01)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              example:
                success: false
                statusCode: 401
                errorCode: ACCOUNT_DEACTIVATED
                error: UNAUTHORIZED
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
        "422":
          description: Invalid email domain (not KKU)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              example:
                success: false
                statusCode: 422
                errorCode: EMAIL_ALREADY_EXISTS_OR_INVALID
                error: UNPROCESSABLE_ENTITY
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get Current Authenticated User
      description: Returns profile, role, status, serverTime (ISO 8601), and idleTimeoutSeconds for countdown warning.
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current session user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/SessionUserDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: User Logout
      description: Revokes active session in database and clears session cookie.
      operationId: logout
      security:
        - cookieAuth: []
        - csrfProtection: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Logged out successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /users:
    get:
      tags:
        - Users
      summary: List Users (Admin)
      description: Server Paginated user list with role, isActive status, search, and sorting.
      operationId: listUsers
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - name
              - email
              - expiresAt
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserDto"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
    post:
      tags:
        - Users
      summary: Create User / Evaluator (Admin)
      description: Creates a new user. Role is locked upon creation. Evaluators require days parameter (BR-USR-04). Audit log recorded.
      operationId: createUser
      security:
        - cookieAuth: []
        - csrfProtection: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDto"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 201
                  data:
                    $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          description: Validation failed (Invalid email or days)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              examples:
                invalidDomain:
                  summary: Email already exists or invalid KKU domain (BR-USR-02)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: EMAIL_ALREADY_EXISTS_OR_INVALID
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                invalidDays:
                  summary: Days must be a positive integer (BR-USR-04)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: VALIDITY_DAYS_INVALID
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get User Detail (Admin)
      operationId: getUserById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
    patch:
      tags:
        - Users
      summary: Update User Profile (Admin)
      description: Updates user display name. Cannot edit email or role directly.
      operationId: updateUser
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: User profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /users/{id}/status:
    patch:
      tags:
        - Users
      summary: Toggle User Active / Inactive Status (Admin)
      description: Changes user status. Cannot deactivate evaluator with pending drafts in open rounds (BR-USR-09). Cannot deactivate self or last admin (BR-USR-14). Must specify days when reactivating evaluator (BR-USR-08).
      operationId: updateUserStatus
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusDto"
      responses:
        "200":
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              examples:
                evaluatorWithDraft:
                  summary: Evaluator has active drafts in OPEN rounds (BR-USR-09)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: CANNOT_DEACTIVATE_EVALUATOR_WITH_DRAFT
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                selfDeactivation:
                  summary: Admin cannot deactivate self or last active admin (BR-USR-14)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: CANNOT_DEACTIVATE_SELF_OR_LAST_ADMIN
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                expiryDaysRequired:
                  summary: Days parameter is required when activating evaluator (BR-USR-08)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: EXPIRY_DAYS_REQUIRED
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /users/{id}/extend-expiry:
    patch:
      tags:
        - Users
      summary: Extend Evaluator Expiration (Admin)
      description: Extends Evaluator validity period by specified days calculated from request date (BR-USR-07, FR-USR-11). Positive integer without ceiling.
      operationId: extendUserExpiry
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
