      description: Shows applicant score, contact (phone, email) and masked citizen ID (1-2345-XXXXX-XX-3). Rate limit 30/min/User. Access is intentionally NOT audit logged per BR-PDP-05.
      operationId: getAllocationById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Allocation detail with masked citizen ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/AllocationDetailDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
    patch:
      tags:
        - Allocations
      summary: Update Individual Allocation Award (Admin)
      description: Sets isAwarded and amount. Executes pessimistic lock (SELECT FOR UPDATE) on allocation summary row to prevent over-allocation (BR-ALC-05). Score must be > 0.00 (BR-ALC-07). Status must be EDITING (BR-ALC-12).
      operationId: updateAllocation
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAllocationDto"
      responses:
        "200":
          description: Allocation updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/AllocationDetailDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Allocation locked because status is FINALIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              example:
                success: false
                statusCode: 409
                errorCode: ALLOCATION_LOCKED_FINALIZED
                error: CONFLICT
                params: null
                timestamp: "2026-10-06T14:00:00.000+07:00"
        "422":
          description: Allocation exceeds budget, mismatch amount, or zero score awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              examples:
                exceedsBudget:
                  summary: Allocated sum exceeds total budget (BR-ALC-05, MSG-23)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: ALLOCATION_EXCEEDS_BUDGET
                    error: UNPROCESSABLE_ENTITY
                    params:
                      total: 520000
                      budget: 500000
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                zeroScore:
                  summary: Applicant with 0.00 score cannot be awarded (BR-ALC-07, MSG-25)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: ZERO_SCORE_CANNOT_AWARD
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
                amountMismatch:
                  summary: Award status and amount mismatch (BR-ALC-06, MSG-24)
                  value:
                    success: false
                    statusCode: 422
                    errorCode: ALLOCATION_AMOUNT_MISMATCH
                    error: UNPROCESSABLE_ENTITY
                    params: null
                    timestamp: "2026-10-06T14:00:00.000+07:00"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /allocations/{id}/reveal-citizen-id:
    post:
      tags:
        - Allocations
      summary: Reveal Full Citizen ID (Admin)
      description: Decrypts full 13-digit citizen ID. Rate limit 10/min/User. Audits access in AuditLog table in the same database transaction before returning (BR-PDP-04, FR-ALC-10).
      operationId: revealCitizenId
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full decrypted citizen ID returned and audited
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      citizenId:
                        type: string
                        example: "1234567890123"
                      viewedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /scholarship-rounds/{roundId}/allocation/finalize:
    post:
      tags:
        - Allocations
      summary: Finalize Scholarship Allocations (Admin)
      description: Locks allocation results (EDITING -> FINALIZED) (BR-ALC-11). Logs ALLOCATION_STATUS_CHANGE.
      operationId: finalizeAllocations
      security:
        - cookieAuth: []
        - csrfProtection: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Allocation finalized and locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/AllocationSummaryDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Already finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
              example:
                success: false
                statusCode: 409
                errorCode: INVALID_ALLOCATION_STATUS
                error: CONFLICT
                params:
                  status: FINALIZED
                  action: finalize_allocation
                timestamp: "2026-10-06T14:00:00.000+07:00"
