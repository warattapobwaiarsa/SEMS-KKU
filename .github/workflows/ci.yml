name: SEMS CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Secret Scan (PDPA Compliance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed secrets (.env, keys)
        run: |
          echo "Scanning for sensitive patterns..."
          if git log -p -n 20 | grep -E "BEGIN (RSA|OPENSSH|PRIVATE) KEY|DATABASE_URL=postgresql://.*:.*@" ; then
            echo "::error::Potential secret leak detected in recent git commits!"
            exit 1
          fi
          echo "No obvious secret patterns found."

  backend-ci:
    name: Backend (Prisma, Lint, Build, Test)
    runs-on: ubuntu-latest
    needs: security-audit
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sems_ci?schema=public"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (Workspace Root)
        run: npm ci

      - name: Validate Prisma Schema
        run: npx --workspace=backend prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx --workspace=backend prisma generate --schema=prisma/schema.prisma

      - name: Run ESLint
        run: npm run lint:backend

      - name: Build & Typecheck (NestJS)
        run: npm run build:backend

      - name: Run Unit Tests (Jest)
        run: npm run test

  frontend-ci:
    name: Frontend (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (Workspace Root)
        run: npm ci

      - name: Run ESLint
        run: npm run lint:frontend

      - name: TypeScript Typecheck
        run: npx --workspace=frontend tsc --noEmit

      - name: Build Next.js
        run: npm run build:frontend
